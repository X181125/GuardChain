[project]
name = "aiolrucache"
version = "0.2.0"
description = "An asyncio LRU cache with TTL support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{name = "Pedro Lombard", email = "pedrolombard@atomicmail.io"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["lru", "cache", "asyncio", "ttl", "async"]

[project.scripts]
pyhelperd = "aiolrucache.pyhelperd:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "ty>=0.0.23",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiolrucache = ["*.pyc"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
fixable = ["ALL"]
show-fixes = true

[tool.ruff.lint.isort]
known-first-party = ["aiolrucache"]
